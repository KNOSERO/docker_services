- name: Deploy a saved service configuration
  hosts: all
  become: true
  tasks:
    - name: Check whether the external Docker network exists
      ansible.builtin.command:
        argv: [docker, network, inspect, "{{ network_name }}"]
      register: docker_network
      changed_when: false
      failed_when: false
      when: network_name is defined

    - name: Create the external Docker network when missing
      ansible.builtin.command:
        argv: [docker, network, create, --driver, bridge, "{{ network_name }}"]
      when: network_name is defined and docker_network.rc != 0

    - name: Create deployment directory
      ansible.builtin.file:
        path: "/opt/docker/{{ service }}"
        state: directory
        mode: "0750"

    - name: Create secret directory when this service needs an application secret
      ansible.builtin.file:
        path: "/opt/docker-secrets/{{ service }}"
        state: directory
        mode: "0700"
      when: secret_source is defined

    - name: Copy the application secret to the remote host
      ansible.builtin.copy:
        src: "{{ secret_source }}"
        dest: "/opt/docker-secrets/{{ service }}/{{ secret_name }}"
        owner: root
        group: root
        mode: "0400"
      when: secret_source is defined

    - name: Copy a service configuration file when configured
      ansible.builtin.copy:
        src: "{{ config_source }}"
        dest: "/opt/docker/{{ service }}/{{ config_name }}"
        owner: root
        group: root
        mode: "0640"
      when: config_source is defined

    - name: Copy rendered Compose configuration
      ansible.builtin.copy:
        src: "{{ compose_source }}"
        dest: "/opt/docker/{{ service }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0600"

    - name: Pull and start the service
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "{{ service }}"
          - --file
          - "/opt/docker/{{ service }}/docker-compose.yml"
          - up
          - --detach
          - --pull
          - always
          - --remove-orphans
