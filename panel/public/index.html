<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111315">
  <title>Services Control Panel</title>
  <link rel="stylesheet" href="/assets/panel.css">
  <link rel="stylesheet" href="/assets/panel-overrides.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#services" aria-label="Services Control Panel home">
        <span class="brand-mark">S</span><span><strong>services</strong><small>CONTROL PANEL</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="navigation" aria-label="Main navigation">
        <button class="nav-item active" data-page="services"><span class="nav-icon">◈</span>Services<span class="nav-count" id="service-count">10</span></button>
        <button class="nav-item" data-page="targets"><span class="nav-icon">⌘</span>Target profiles</button>
        <button class="nav-item" data-page="jobs"><span class="nav-icon">↗</span>Deployment jobs<span class="nav-count" id="job-count">0</span></button>
      </nav>
      <div class="sidebar-bottom">
        <div class="connection"><span class="pulse"></span><span>Controller online</span><code>127.0.0.1:6868</code></div>
        <div class="profile"><div class="avatar">OP</div><div><strong>Operator</strong><small>Local instance</small></div><span class="profile-menu">···</span></div>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar"><div class="breadcrumbs"><span>Workspace</span><b>/</b><strong id="breadcrumb-current">Services</strong></div><div class="top-actions"><span class="environment"><i></i>LOCAL</span><button class="icon-button" aria-label="Notifications">♧</button></div></header>
      <div id="content" class="page-content" aria-live="polite"><div class="loading">Loading services…</div></div>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/assets/panel.js"></script>
</body>
</html>
