apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecretName }}
      containers:
        - name: panel
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 6868
          env:
            - name: PORT
              value: "6868"
            - name: PANEL_BIND_HOST
              value: 0.0.0.0
            - name: PANEL_SECRETS_DIR
              value: /app/secrets
            - name: PANEL_TARGET_SECRETS_DIR
              value: /app/target-secrets
            - name: PANEL_ALLOWED_HOSTS
              value: "{{ .Release.Name }}:6868,{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:6868"
          volumeMounts:
            - name: panel-state
              mountPath: /app/.config
            - name: panel-secrets
              mountPath: /app/secrets
              readOnly: true
            - name: panel-target-secrets
              mountPath: /app/target-secrets
              readOnly: true
      volumes:
        - name: panel-state
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        - name: panel-secrets
          secret:
            secretName: {{ .Values.secrets.name }}
            optional: true
            defaultMode: 0400
        - name: panel-target-secrets
          secret:
            secretName: {{ .Values.targetCredentials.name }}
            defaultMode: 0400
