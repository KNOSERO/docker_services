{
  "services": {
    "jenkins": {
      "container_name": "jenkins",
      "image": "jenkins/jenkins:lts-jdk17",
      "restart": "unless-stopped",
      "ports": [
        "8080:8080",
        "50000:50000"
      ],
      "volumes": [
        "/mnt/core_data/jenkins:/var/jenkins_home"
      ],
      "environment": {
        "TZ": "Europe/Warsaw"
      }
    }
  }
}
