{
  "name": "nexus",
  "namespace": "nexus",
  "replicas": 1,
  "image": {
    "repository": "sonatype/nexus3",
    "tag": "latest",
    "pullPolicy": "IfNotPresent"
  },
  "service": {
    "type": "ClusterIP"
  },
  "ports": [
    8081,
    5000
  ],
  "servicePorts": [
    {
      "name": "web",
      "port": 8081,
      "targetPort": 8081
    },
    {
      "name": "registry",
      "port": 5000,
      "targetPort": 5000
    }
  ],
  "containerPorts": [
    {
      "containerPort": 8081,
      "protocol": "TCP"
    },
    {
      "containerPort": 5000,
      "protocol": "TCP"
    }
  ],
  "env": [],
  "runAsUser": 0,
  "volumes": [
    {
      "name": "data",
      "hostPath": "/mnt/core_data/nexus",
      "mountPath": "/nexus-data"
    }
  ],
  "hostNetwork": false,
  "configMounts": [],
  "configMaps": [],
  "ingress": {
    "hosts": []
  },
  "secrets": {
    "enabled": false,
    "name": "nexus-secrets"
  }
}
