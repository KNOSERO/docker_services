{
  "name": "dns",
  "namespace": "dns",
  "replicas": 1,
  "image": {
    "repository": "pihole/pihole",
    "tag": "latest",
    "pullPolicy": "IfNotPresent"
  },
  "service": {
    "type": "ClusterIP"
  },
  "ports": [
    53,
    67,
    80
  ],
  "servicePorts": [
    {
      "name": "dns-tcp",
      "port": 53,
      "targetPort": 53,
      "protocol": "TCP"
    },
    {
      "name": "dns-udp",
      "port": 53,
      "targetPort": 53,
      "protocol": "UDP"
    },
    {
      "name": "dhcp",
      "port": 67,
      "targetPort": 67,
      "protocol": "UDP"
    },
    {
      "name": "web",
      "port": 82,
      "targetPort": 80
    }
  ],
  "containerPorts": [
    {
      "containerPort": 53,
      "protocol": "TCP"
    },
    {
      "containerPort": 53,
      "protocol": "UDP"
    },
    {
      "containerPort": 67,
      "protocol": "UDP"
    },
    {
      "containerPort": 80,
      "protocol": "TCP"
    }
  ],
  "env": [
    {
      "name": "TZ",
      "value": "Europe/Warsaw"
    }
  ],
  "runAsUser": 0,
  "volumes": [
    {
      "name": "data",
      "hostPath": "/mnt/core_data/pihole",
      "mountPath": "/etc/pihole"
    },
    {
      "name": "dnsmasq",
      "hostPath": "/mnt/core_data/pihole/dnsmasq.d",
      "mountPath": "/etc/dnsmasq.d"
    }
  ],
  "hostNetwork": true,
  "configMounts": [],
  "configMaps": [],
  "ingress": {
    "hosts": []
  },
  "secrets": {
    "enabled": false,
    "name": "dns-secrets"
  }
}
