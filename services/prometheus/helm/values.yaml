{
  "name": "prometheus",
  "namespace": "prometheus",
  "replicas": 1,
  "image": {
    "repository": "prom/prometheus",
    "tag": "latest",
    "pullPolicy": "IfNotPresent"
  },
  "service": {
    "type": "ClusterIP"
  },
  "ports": [
    9090
  ],
  "servicePorts": [
    {
      "name": "web",
      "port": 9090,
      "targetPort": 9090
    }
  ],
  "containerPorts": [
    {
      "containerPort": 9090,
      "protocol": "TCP"
    }
  ],
  "env": [],
  "runAsUser": 0,
  "volumes": [
    {
      "name": "data",
      "hostPath": "/mnt/core_data/prometheus",
      "mountPath": "/prometheus"
    }
  ],
  "hostNetwork": false,
  "configMounts": [
    {
      "name": "prometheus-config",
      "configMap": "prometheus-config",
      "mountPath": "/etc/prometheus/prometheus.yml",
      "subPath": "prometheus.yml",
      "readOnly": true
    }
  ],
  "configMaps": [
    {
      "name": "prometheus",
      "path": "config/prometheus.yml"
    }
  ],
  "ingress": {
    "hosts": []
  },
  "secrets": {
    "enabled": false,
    "name": "prometheus-secrets"
  }
}
